name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install JavaScript dependencies
        run: npm ci

      # Cargo embeds the adapter produced by npm test.
      - name: Build frontend and test JavaScript
        run: npm test

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release

      - name: Test lyrics parsing and timing
        run: npm run test:lyrics

      - name: Test ad blocker and compile WebKit rules
        run: npm run test:adblock

      # Capability checks only: never presents a Touch Bar on the runner.
      - name: Test global Touch Bar capability probe
        run: npm run test:global

      - name: Package macOS app
        run: npm run app -- --ci -- --locked
